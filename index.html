<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Research &amp; Reflection · RR420 · Armand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --u: min(1.05vw, 1.9vh);
    --ease: cubic-bezier(.2,.8,.2,1);
    --glass: rgba(15,17,36,.66);
    --glass-hi: rgba(255,255,255,.10);
    --line: rgba(255,255,255,.15);
    --text: #f4f5fb;
    --dim: rgba(244,245,251,.68);
    --accent: #7b5cff;
    --serif: Georgia, 'Times New Roman', serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:#05060d; color:var(--text);
    font-family:Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing:antialiased; }
  body{ overflow:hidden; }
  button{ font:inherit; color:inherit; cursor:pointer; }
  ::selection{ background:var(--accent); color:#fff; }

  /* ---------- wallpapers ---------- */
  .bgs{ position:fixed; inset:0; z-index:0; }
  .bg{ position:absolute; inset:0; opacity:0; transform:scale(1.04); transition:opacity .7s ease, transform 1.2s var(--ease); }
  .bg.on{ opacity:1; transform:scale(1); }
  .bg svg{ position:absolute; inset:0; width:100%; height:100%; }
  .bg .drift{ animation:drift 26s ease-in-out infinite alternate; }
  @keyframes drift{ from{ transform:translate(-14px,6px); } to{ transform:translate(18px,-8px); } }
  .shade{ position:fixed; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(180deg, rgba(3,4,10,.55) 0%, rgba(3,4,10,0) 22%, rgba(3,4,10,0) 45%, rgba(3,4,10,.72) 100%); }

  /* ---------- system bar ---------- */
  .topbar{ position:absolute; top:0; left:0; right:0; z-index:6; display:flex; justify-content:space-between; align-items:center;
    padding:calc(var(--u)*2.2) calc(var(--u)*4.2) 0; }
  .brand__t{ font-size:calc(var(--u)*1.5); font-weight:600; letter-spacing:.01em; }
  .brand__s{ display:block; font-size:max(11.5px, calc(var(--u)*.9)); color:var(--dim); margin-top:2px; }
  .sys{ display:flex; align-items:center; gap:calc(var(--u)*1.6); }
  .sys__btn{ width:calc(var(--u)*2.8); height:calc(var(--u)*2.8); border-radius:50%; border:0; background:transparent; display:grid; place-items:center; transition:background .2s, transform .25s var(--ease); }
  .sys__btn svg{ width:60%; height:60%; fill:none; stroke:#fff; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .sys__btn:hover,.sys__btn:focus{ background:var(--glass-hi); }
  .sys__btn:focus{ outline:2px solid #fff; outline-offset:2px; transform:scale(1.08); }
  .avatar{ position:relative; width:calc(var(--u)*2.8); height:calc(var(--u)*2.8); border-radius:50%; display:grid; place-items:center;
    background:linear-gradient(135deg,#d4883a,#c9683f); font-weight:600; font-size:calc(var(--u)*1.2); }
  .avatar i{ position:absolute; right:-2px; bottom:-2px; width:calc(var(--u)*.8); height:calc(var(--u)*.8); border-radius:50%; background:#2fd27a; border:2px solid #0b0c1a; }
  #clock{ font-size:calc(var(--u)*1.75); font-weight:500; font-variant-numeric:tabular-nums; min-width:5.2ch; text-align:right; }

  /* ---------- tile row ---------- */
  .row{ position:absolute; z-index:5; left:calc(var(--u)*4.2); top:calc(var(--u)*7.2); right:0; display:flex; align-items:flex-start; gap:calc(var(--u)*1.2); }
  .tile{ position:relative; flex:none; padding:0; border:0; background:transparent;
    width:calc(var(--u)*4.8); height:calc(var(--u)*4.8); border-radius:calc(var(--u)*1);
    transition:width .5s var(--ease), height .5s var(--ease); }
  .tile__art{ position:absolute; inset:0; border-radius:inherit; overflow:hidden; background:#10121f; box-shadow:0 6px 22px rgba(0,0,0,.45); transition:transform .5s var(--ease); }
  .tile__art svg{ width:100%; height:100%; display:block; }
  .tile.selected{ width:calc(var(--u)*7.8); height:calc(var(--u)*7.8); }
  .tile::after{ content:""; position:absolute; inset:-5px; border-radius:calc(var(--u)*1.35); border:2px solid transparent; pointer-events:none; transition:border-color .25s, box-shadow .25s; }
  .tile.selected::after{ border-color:rgba(255,255,255,.28); }
  .tile:focus{ outline:none; }
  .tile:focus::after{ border-color:#fff; }
  .tile.selected:focus::after{ box-shadow:0 0 0 1px rgba(255,255,255,.4), 0 0 calc(var(--u)*2.2) color-mix(in srgb, var(--accent) 70%, transparent); animation:breathe 2.4s ease-in-out infinite; }
  @keyframes breathe{ 50%{ box-shadow:0 0 0 1px rgba(255,255,255,.25), 0 0 calc(var(--u)*3) color-mix(in srgb, var(--accent) 45%, transparent); } }
  .tile:not(.selected):hover .tile__art{ transform:scale(1.06); }
  .tile__label{ position:absolute; left:0; top:100%; margin-top:calc(var(--u)*1.05); white-space:nowrap; font-size:calc(var(--u)*1.4); font-weight:500;
    text-shadow:0 1px 8px rgba(0,0,0,.6); opacity:0; transform:translateY(-5px); transition:opacity .35s .1s, transform .45s .1s var(--ease); }
  .tile.selected .tile__label{ opacity:1; transform:none; }

  /* ---------- views ---------- */
  .content{ position:absolute; inset:0; z-index:2; pointer-events:none; }
  .view{ position:absolute; inset:0; opacity:0; visibility:hidden; transition:opacity .45s ease, visibility 0s .45s; }
  .view.active{ opacity:1; visibility:visible; pointer-events:auto; transition:opacity .45s ease; }
  .view.active .rise{ animation:rise .7s var(--ease) backwards; animation-delay:calc(var(--i, 0) * 65ms + 80ms); }
  @keyframes rise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }

  /* game view */
  .hero{ position:absolute; left:calc(var(--u)*4.2); bottom:calc(var(--u)*9); max-width:calc(var(--u)*46); }
  .hero__sem{ display:flex; align-items:center; gap:calc(var(--u)*.8); font-size:calc(var(--u)*1.3); color:var(--dim); margin-bottom:calc(var(--u)*.9); }
  .hero__sem b{ display:inline-block; padding:.15em .65em; border:1px solid var(--line); border-radius:6px; font-weight:500; color:var(--text); font-size:.9em; }
  .hero h1{ margin:0 0 calc(var(--u)*1.1); font:400 clamp(30px, calc(var(--u)*4.8), 88px)/1.03 var(--serif); text-shadow:0 2px 24px rgba(0,0,0,.55); letter-spacing:-.01em; }
  .hero p{ margin:0 0 calc(var(--u)*2); font-size:max(14px, calc(var(--u)*1.28)); line-height:1.55; color:rgba(244,245,251,.82); max-width:52ch; text-shadow:0 1px 12px rgba(0,0,0,.6); }
  .actions{ display:flex; align-items:center; gap:calc(var(--u)*1); }
  .btn-main{ height:calc(var(--u)*3.9); padding:0 calc(var(--u)*3.6); border-radius:999px; border:0; background:rgba(255,255,255,.17);
    backdrop-filter:blur(12px); font-size:calc(var(--u)*1.4); font-weight:500; transition:transform .3s var(--ease), background .2s, color .2s; }
  .btn-round{ width:calc(var(--u)*3.9); height:calc(var(--u)*3.9); border-radius:50%; border:0; background:rgba(255,255,255,.17); backdrop-filter:blur(12px);
    display:grid; place-items:center; transition:transform .3s var(--ease), background .2s; }
  .btn-round svg{ width:52%; height:52%; fill:#fff; }
  .btn-main:hover,.btn-round:hover{ background:rgba(255,255,255,.26); }
  .btn-main:focus,.btn-round:focus{ outline:none; background:#fff; color:#0b0c1a; transform:scale(1.06); box-shadow:0 0 calc(var(--u)*2.4) color-mix(in srgb, var(--accent) 60%, transparent); }
  .btn-round:focus svg{ fill:#0b0c1a; }

  .prog{ position:absolute; right:calc(var(--u)*4.2); bottom:calc(var(--u)*9); width:calc(var(--u)*27); padding:calc(var(--u)*1.5) calc(var(--u)*1.8);
    background:var(--glass); backdrop-filter:blur(16px); border:1px solid var(--line); border-radius:calc(var(--u)*.9); }
  .prog__top{ display:flex; gap:calc(var(--u)*3); }
  .stat span{ display:block; font-size:max(11.5px, calc(var(--u)*.95)); color:var(--dim); }
  .stat b{ display:block; font-size:calc(var(--u)*2.1); font-weight:600; font-variant-numeric:tabular-nums; line-height:1.2; }
  .prog__bar{ height:5px; border-radius:9px; background:rgba(255,255,255,.14); margin:calc(var(--u)*1.1) 0; overflow:hidden; }
  .prog__bar i{ display:block; height:100%; width:0; background:var(--accent); border-radius:9px; transition:width 1.1s .3s var(--ease); }
  .view.active .prog__bar i{ width:var(--w, 100%); }
  .chips{ display:flex; gap:calc(var(--u)*.7); flex-wrap:wrap; }
  .chip{ font-size:max(11.5px, calc(var(--u)*.95)); padding:.28em .8em; border-radius:999px; background:rgba(255,255,255,.09); color:var(--dim); }

  /* welcome dashboard */
  .dash{ position:absolute; left:calc(var(--u)*4.2); right:calc(var(--u)*4.2); top:calc(var(--u)*22); bottom:calc(var(--u)*9);
    display:grid; grid-template-columns:1.15fr 1fr 1.15fr; grid-template-rows:1.2fr .85fr 1fr; gap:calc(var(--u)*1.1); }
  .card{ position:relative; text-align:left; border:1px solid var(--line); border-radius:calc(var(--u)*1); background:var(--glass); backdrop-filter:blur(16px);
    padding:calc(var(--u)*1.5) calc(var(--u)*1.8); overflow:hidden; display:flex; flex-direction:column; min-height:0;
    transition:transform .35s var(--ease), box-shadow .35s, border-color .2s; }
  .card:hover{ border-color:rgba(255,255,255,.3); }
  .card:focus{ outline:3px solid #fff; outline-offset:3px; transform:scale(1.025); z-index:3; box-shadow:0 14px 40px rgba(0,0,0,.5), 0 0 calc(var(--u)*3) color-mix(in srgb, var(--accent) 50%, transparent); }
  .card__k{ display:flex; align-items:center; gap:.6em; font-size:max(12px, calc(var(--u)*1.05)); color:var(--dim); font-weight:500; }
  .card__k svg{ width:1.25em; height:1.25em; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .card__k em{ margin-left:auto; font-style:normal; }
  .card h3{ margin:calc(var(--u)*.55) 0 calc(var(--u)*.3); font-size:calc(var(--u)*1.45); font-weight:600; line-height:1.2; }
  .card p{ margin:0; font-size:max(12.5px, calc(var(--u)*1.08)); line-height:1.45; color:var(--dim); }
  .c-intent{ grid-column:1; grid-row:1 / span 3; justify-content:flex-end;
    background:linear-gradient(180deg, rgba(20,16,50,.2), rgba(8,8,24,.85)), radial-gradient(120% 80% at 30% 0%, rgba(123,92,255,.55), transparent 60%), var(--glass); }
  .c-intent .card__k{ position:absolute; top:calc(var(--u)*1.5); left:calc(var(--u)*1.8); right:calc(var(--u)*1.8); }
  .c-intent q{ quotes:none; display:block; font:400 clamp(24px, calc(var(--u)*3.3), 60px)/1.1 var(--serif); margin-bottom:calc(var(--u)*1.2); text-shadow:0 2px 20px rgba(0,0,0,.5); }
  .c-intent small{ font-size:max(12px, calc(var(--u)*1.05)); color:var(--dim); }
  .c-who{ grid-column:2; grid-row:1; }
  .c-trophies{ grid-column:2; grid-row:2; }
  .c-stack{ grid-column:2; grid-row:3; }
  .c-infl{ grid-column:3; grid-row:1 / span 3; justify-content:flex-end;
    background:linear-gradient(180deg, rgba(8,8,20,.05), rgba(8,8,20,.88)), radial-gradient(100% 70% at 70% 10%, rgba(212,136,58,.6), transparent 60%), radial-gradient(90% 60% at 20% 40%, rgba(29,158,117,.45), transparent 65%), var(--glass); }
  .c-infl .card__k{ position:absolute; top:calc(var(--u)*1.5); left:calc(var(--u)*1.8); right:calc(var(--u)*1.8); }
  .c-infl .names{ font:400 clamp(22px, calc(var(--u)*3), 54px)/1.12 var(--serif); margin-bottom:calc(var(--u)*1); text-shadow:0 2px 20px rgba(0,0,0,.5); }
  .c-infl small{ color:var(--dim); font-size:max(12px, calc(var(--u)*1.05)); }
  .tro{ display:flex; gap:calc(var(--u)*1.6); margin-top:calc(var(--u)*.7); align-items:center; }
  .tro span{ display:inline-flex; align-items:center; gap:.4em; font-size:max(13px, calc(var(--u)*1.15)); font-weight:500; font-variant-numeric:tabular-nums; }
  .tro svg{ width:1.35em; height:1.35em; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .g-platinum{ color:#b9c7ff; } .g-gold{ color:#e6b84a; } .g-silver{ color:#c4c9d6; } .g-bronze{ color:#cd8544; }
  .mini{ height:5px; border-radius:9px; background:rgba(255,255,255,.14); margin-top:calc(var(--u)*.9); overflow:hidden; }
  .mini i{ display:block; height:100%; background:#4d8dff; border-radius:9px; }

  .pills{ position:absolute; left:calc(var(--u)*4.2); bottom:calc(var(--u)*2.8); display:flex; gap:calc(var(--u)*.9); }
  .pill{ height:calc(var(--u)*3.6); padding:0 calc(var(--u)*2); border-radius:999px; border:1px solid var(--line); background:var(--glass); backdrop-filter:blur(14px);
    font-size:calc(var(--u)*1.2); font-weight:500; display:inline-flex; align-items:center; gap:.7em; transition:transform .3s var(--ease), background .2s, color .2s; }
  .pill svg{ width:1.2em; height:1.2em; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .pill:focus{ outline:none; background:#fff; color:#0b0c1a; transform:scale(1.05); }

  .hint{ position:fixed; z-index:6; right:calc(var(--u)*4.2); bottom:calc(var(--u)*2.8); display:flex; gap:calc(var(--u)*2); font-size:max(11.5px, calc(var(--u)*1.05)); color:var(--dim); }
  .hint span{ display:inline-flex; align-items:center; gap:.55em; }
  .hint kbd{ font:inherit; min-width:1.9em; text-align:center; padding:.12em .5em; border:1px solid var(--line); border-radius:999px; color:var(--text); background:rgba(255,255,255,.06); }

  /* ---------- popovers ---------- */
  .pop{ position:fixed; z-index:40; min-width:calc(var(--u)*24); padding:calc(var(--u)*.7); background:rgba(18,20,40,.92); backdrop-filter:blur(22px);
    border:1px solid var(--line); border-radius:calc(var(--u)*1); box-shadow:0 20px 50px rgba(0,0,0,.55);
    opacity:0; transform:translateY(6px) scale(.98); transform-origin:top left; pointer-events:none; visibility:hidden; transition:opacity .2s, transform .3s var(--ease), visibility 0s .3s; }
  .pop.open{ opacity:1; transform:none; pointer-events:auto; visibility:visible; transition:opacity .2s, transform .3s var(--ease); }
  .pop__item{ display:flex; width:100%; align-items:center; justify-content:space-between; gap:calc(var(--u)*2); text-align:left; border:0; background:transparent;
    padding:calc(var(--u)*1.1) calc(var(--u)*1.3); border-radius:calc(var(--u)*.7); font-size:max(13.5px, calc(var(--u)*1.25)); }
  .pop__item:hover{ background:rgba(255,255,255,.08); }
  .pop__item:focus{ outline:none; background:#fff; color:#0b0c1a; }
  .pop__title{ padding:calc(var(--u)*.7) calc(var(--u)*1.3) calc(var(--u)*.5); font-size:max(11.5px, calc(var(--u)*1)); color:var(--dim); }
  .sw{ width:calc(var(--u)*3.6); height:calc(var(--u)*2); border-radius:99px; background:rgba(255,255,255,.22); position:relative; flex:none; transition:background .2s; }
  .sw::after{ content:""; position:absolute; top:3px; left:3px; width:calc(var(--u)*2 - 6px); height:calc(var(--u)*2 - 6px); border-radius:50%; background:#fff; transition:transform .25s var(--ease); }
  [aria-checked="true"] .sw{ background:#4d8dff; }
  [aria-checked="true"] .sw::after{ transform:translateX(calc(var(--u)*1.6)); }
  #settings{ top:calc(var(--u)*6); right:calc(var(--u)*4.2); transform-origin:top right; }

  /* ---------- sheet ---------- */
  .sheet{ position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:2vh 2vw; }
  .sheet[hidden]{ display:none; }
  .sheet__scrim{ position:absolute; inset:0; background:rgba(4,5,12,.6); backdrop-filter:blur(20px); opacity:0; transition:opacity .35s; }
  .sheet.open .sheet__scrim{ opacity:1; }
  .sheet__panel{ position:relative; width:min(94vw, calc(var(--u)*66)); max-height:92vh; display:flex; flex-direction:column;
    background:rgba(17,19,40,.92); border:1px solid var(--line); border-radius:calc(var(--u)*1.4); box-shadow:0 30px 90px rgba(0,0,0,.6); overflow:hidden; }
  .sheet__bar{ display:flex; justify-content:space-between; align-items:center; padding:calc(var(--u)*1.6) calc(var(--u)*2.6) 0; font-size:max(12px, calc(var(--u)*1.1)); color:var(--dim); }
  .sheet__body{ padding:calc(var(--u)*1.2) calc(var(--u)*2.6) calc(var(--u)*2); overflow:auto; outline:none; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.25) transparent; opacity:0; transition:opacity .3s .15s; }
  .sheet.open .sheet__body{ opacity:1; }
  .sheet__body.swap{ animation:rise .5s var(--ease) backwards; }
  .sheet__foot{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:calc(var(--u)*1.2) calc(var(--u)*2.6); border-top:1px solid var(--line); }
  .sheet__foot button{ border:0; background:transparent; padding:.5em .9em; border-radius:999px; font-size:max(12.5px, calc(var(--u)*1.15)); color:var(--dim); display:inline-flex; gap:.6em; align-items:center; }
  .sheet__foot button:hover{ color:var(--text); background:rgba(255,255,255,.08); }
  .sheet__foot button:focus{ outline:none; background:#fff; color:#0b0c1a; }
  .sheet__foot button[disabled]{ visibility:hidden; }
  .sheet h2{ margin:0 0 calc(var(--u)*1.4); font:400 clamp(26px, calc(var(--u)*3.3), 52px)/1.1 var(--serif); }
  .sheet p{ margin:0 0 calc(var(--u)*1.3); font-size:max(15px, calc(var(--u)*1.42)); line-height:1.68; max-width:64ch; color:rgba(244,245,251,.9); }
  .sheet p.lede{ font-family:var(--serif); font-style:italic; font-size:max(18px, calc(var(--u)*1.9)); color:var(--text); }
  .sheet .sign{ margin-top:calc(var(--u)*2); font-size:max(12px, calc(var(--u)*1.05)); color:var(--dim); }
  .spec{ border:1px solid var(--line); border-radius:calc(var(--u)*.8); overflow:hidden; margin:calc(var(--u)*1.4) 0; }
  .spec div{ display:flex; justify-content:space-between; gap:calc(var(--u)*2); padding:calc(var(--u)*1) calc(var(--u)*1.4); border-bottom:1px solid var(--line); font-size:max(13.5px, calc(var(--u)*1.2)); }
  .spec div:last-child{ border-bottom:0; }
  .spec b{ font-weight:500; color:var(--dim); flex:none; }
  .spec span{ text-align:right; }
  .spec.q span{ text-align:left; }
  .spec.q b{ min-width:3.2em; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:calc(var(--u)*1.2); margin-top:calc(var(--u)*1.4); }
  .two > div{ padding:calc(var(--u)*1.4); border:1px solid var(--line); border-radius:calc(var(--u)*.8); background:rgba(255,255,255,.04); }
  .two h3{ margin:0 0 .4em; font:400 calc(var(--u)*1.9)/1.2 var(--serif); }
  .two p{ font-size:max(14px, calc(var(--u)*1.25)); margin:0; }
  .tlist{ display:grid; gap:calc(var(--u)*.7); margin-top:calc(var(--u)*1.2); }
  .trow{ display:grid; grid-template-columns:auto 1fr auto; gap:calc(var(--u)*1.4); align-items:center; padding:calc(var(--u)*1.1) calc(var(--u)*1.4); border:1px solid var(--line); border-radius:calc(var(--u)*.8); background:rgba(255,255,255,.04); }
  .trow.locked{ opacity:.55; }
  .trow svg{ width:calc(var(--u)*3); height:calc(var(--u)*3); fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .trow h4{ margin:0; font-size:max(14.5px, calc(var(--u)*1.35)); font-weight:600; }
  .trow p{ margin:.15em 0 0; font-size:max(13px, calc(var(--u)*1.12)); color:var(--dim); line-height:1.45; }
  .trow small{ font-size:max(12px, calc(var(--u)*1)); color:var(--dim); white-space:nowrap; }
  .trow.done small{ color:#7fe0a8; }
  .tgroup{ display:flex; justify-content:space-between; align-items:baseline; margin:calc(var(--u)*2.2) 0 calc(var(--u)*.7); font:400 calc(var(--u)*1.9)/1.2 var(--serif); }
  .tgroup small{ font:400 max(12px, calc(var(--u)*1)) Inter, system-ui, sans-serif; color:var(--dim); }
  .thead{ display:flex; gap:calc(var(--u)*2.4); flex-wrap:wrap; margin-bottom:calc(var(--u)*.6); font-size:1.15em; }

  /* ---------- launch (tile expands to full screen) ---------- */
  .launch{ position:fixed; z-index:100; overflow:hidden; border-radius:calc(var(--u)*1);
    transition:left .55s var(--ease), top .55s var(--ease), width .55s var(--ease), height .55s var(--ease), border-radius .55s var(--ease); }
  .launch svg{ width:100%; height:100%; display:block; }
  .launch.go{ left:0 !important; top:0 !important; width:100vw !important; height:100vh !important; border-radius:0; }


  /* ---------- boot + sign-in ---------- */

<noscript><p style="position:relative;z-index:9;padding:24px">This page needs JavaScript. Open the <a href="rr-website/project/Interactive%20Journal.html" style="color:#fff">Semester 1 journal</a> or the <a href="rr-website/project/Interactive%20Journal.html?sem=2" style="color:#fff">Semester 2 journal</a> directly.</p></noscript>

<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var JOURNAL_URL = "rr-website/project/Interactive%20Journal.html";

  /* ============ manifesto text ============ */
  var M = {
    who: { tag: "001 · Who I am", title: "Who I am", html:
      "<p>I am a developer who makes things that are supposed to feel like more than software. Before I am anything else creatively, I am a builder: of interfaces, of small machines, of systems that hold a person's attention for a moment and give something back.</p>" +
      "<p>I co-run Stack Studio, and everything I make outside of it pays rent to the same instinct: take something raw (code, steel, an old engine bay) and give it a shape that means something.</p>" },
    stack: { tag: "002 · What I work with", title: "What I work with", html:
      "<p>Technically, I work on two sides of the same problem: the frameworks that hold a system together, and the tools that make it feel alive rather than just function.</p>" +
      "<div class='spec'><div><b>Structure</b><span>React · Next.js · TypeScript · C# / .NET</span></div><div><b>Expression</b><span>Three.js · GSAP · Claude API</span></div></div>" +
      "<p>Conceptually, I keep returning to three questions.</p>" +
      "<div class='spec q'><div><b>One</b><span>What happens in the gap between a person and a machine that is trying to understand them?</span></div>" +
      "<div><b>Two</b><span>How much can be said through restraint, ritual and atmosphere instead of instruction?</span></div>" +
      "<div><b>Three</b><span>What does it mean to build something that has to hold real human weight (grief, memory, trust) without breaking under it?</span></div></div>" },
    intent: { tag: "003 · What I intend to make", title: "What I intend to make", html:
      "<p class='lede'>I intend to keep building interfaces that sit at the edge of comfortable.</p>" +
      "<p>An AI avatar that has to hold a donor's grief with care, not just answer their questions. A puzzle space built like a ritual, where the room teaches you how to move through it before you understand why.</p>" +
      "<p>I intend to keep refusing the easy version of both extremes: technology that manipulates by being too smooth, and craft that romanticises itself by being deliberately difficult.</p>" },
    influences: { tag: "004 · Where this comes from", title: "Where this comes from", html:
      "<p>Both shaped the Masonic Temple puzzle and the Lulama avatar this year. One borrows Chen's trust in atmosphere over instruction. The other sits inside McCarthy's question of what it means to let an AI stand in for human presence.</p>" +
      "<div class='two'><div><h3>Jenova Chen</h3><p>Connection designed through restraint: a system saying less so a person feels more. I have felt the same thing from the other side of the screen, chasing platinum trophies not for the trophy but for the quiet, wordless moments a well-designed world hands you once you have earned them.</p></div>" +
      "<div><h3>Lauren Lee McCarthy</h3><p>The discomfort she builds in on purpose. Letting a machine get close to a person is never neutral, and whoever builds that closeness carries responsibility for it.</p></div></div>" },
    outside: { tag: "005 · Who I am outside of this", title: "Who I am outside of this", html:
      "<p>I am also someone who is pulling a 1991 Defender 110 apart to drop a 3.5-litre V8 into it. Not because it is efficient, but because there is a version of that truck that only exists once I have built it myself, and I would rather spend a weekend under it than read about someone else's build.</p>" +
      "<p>I climb for the people at the wall more than the grade, dive to be somewhere I cannot code, and reload my own ammunition because I do not trust a process I have not measured myself.</p>" +
      "<p>None of that is separate from the work. It is the same instinct that shows up late at night, debugging a Three.js scene: the refusal to leave a system half-understood, whether it runs on fuel, brass or JavaScript.</p>" +
      "<p>I am still becoming the kind of maker who can hold all of that at once: the explorer, the gamer, the mechanic and the developer, all reaching for the same thing from different directions.</p>" +
      "<div class='sign'>Armand Naudé · Semester 2, 2026 · subject to revision</div>" }
  };
  var ORDER = ["who", "stack", "intent", "influences", "outside"];

  /* ============ trophies: year milestones + the two journal games ============ */
  var RR = window.RR;
  var TROPHIES = RR ? RR.year : [];
  var TROPHY_SVG = '<svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1.5A3 3 0 0 0 7 10.5M17 6h3v1.5a3 3 0 0 1-3 3"/><path d="M12 14v3.5M8.5 20h7M9.5 17.5h5"/></svg>';
  var GRADES = ["platinum", "gold", "silver", "bronze"];
  var RANK = { platinum: 0, gold: 1, silver: 2, bronze: 3 };
  function trophyCounts() {
    var c = { platinum: 0, gold: 0, silver: 0, bronze: 0 }, done = 0, total = 0;
    TROPHIES.forEach(function (t) { total++; if (t.state === "done") { c[t.g]++; done++; } });
    if (RR) ["s1", "s2"].forEach(function (k) {
      var p = RR.progress(k); total += p.total; done += p.earned;
